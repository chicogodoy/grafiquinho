services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: print-grafico-backend
    ports:
      - "8000:8000"
    environment:
      - DUCKDB_PATH=/app/data/print_grafico.duckdb
    volumes:
      - duckdb_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    container_name: print-grafico-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  duckdb_data:

